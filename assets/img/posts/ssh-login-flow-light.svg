 class="text-outer-tspan row" x="0" y="-0.1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">1.</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> 生成密钥对</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> (ssh-keygen)</tspan></tspan><tspan class="text-outer-tspan row" x="0" y="1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">私钥</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> id_ed25519</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> /</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> 公钥</tspan></tspan><tspan class="text-outer-tspan row" x="0" y="2.1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">id_ed25519.pub</tspan></tspan></text></g></g></g><g class="node default" id="output2-flowchart-B-1" data-look="classic" transform="translate(468.5625, 75.0999984741211)"><rect class="basic label-container" style="" x="-126.8828125" y="-42.099998474121094" width="253.765625" height="84.19999694824219"></rect><g class="label" style="" transform="translate(0, -27.099998474121094)"><rect></rect><g><rect class="background" style="stroke: none"></rect><text y="-10.1" style=""><tspan class="text-outer-tspan row" x="0" y="-0.1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">3.</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> 配置</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> ~/.ssh/config</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> 别名</tspan></tspan><tspan class="text-outer-tspan row" x="0" y="1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">Host</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> myserver</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> -</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> IP</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> /</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> User</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> /</tspan></tspan><tspan class="text-outer-tspan row" x="0" y="2.1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">Port</tspan></tspan></text></g></g></g><g class="node default" id="output2-flowchart-E-2" data-look="classic" transform="translate(468.5625, 209.29999542236328)"><rect class="basic label-container" style="" x="-120.546875" y="-24.5" width="241.09375" height="49"></rect><g class="label" style="" transform="translate(0, -9.5)"><rect></rect><g><rect class="background" style="stroke: none"></rect><text y="-10.1" style=""><tspan class="text-outer-tspan row" x="0" y="-0.1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">4.</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> 终端执行</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> ssh</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> myserver</tspan></tspan></text></g></g></g><g class="node default" id="output2-flowchart-C-3" data-look="classic" transform="translate(170.5078125, 407.6999931335449)"><rect class="basic label-container" style="" x="-114.5703125" y="-33.29999923706055" width="229.140625" height="66.5999984741211"></rect><g class="label" style="" transform="translate(0, -18.299999237060547)"><rect></rect><g><rect class="background" style="stroke: none"></rect><text y="-10.1" style=""><tspan class="text-outer-tspan row" x="0" y="-0.1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">2.</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> 接收公钥写入</tspan></tspan><tspan class="text-outer-tspan row" x="0" y="1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">~/.ssh/authorized_keys</tspan></tspan></text></g></g></g><g class="node default" id="output2-flowchart-D-4" data-look="classic" transform="translate(468.5625, 407.6999931335449)"><rect class="basic label-container" style="" x="-98.671875" y="-33.29999923706055" width="197.34375" height="66.5999984741211"></rect><g class="label" style="" transform="translate(0, -18.299999237060547)"><rect></rect><g><rect class="background" style="stroke: none"></rect><text y="-10.1" style=""><tspan class="text-outer-tspan row" x="0" y="-0.1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">5.</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> 校验公钥成功</tspan></tspan><tspan class="text-outer-tspan row" x="0" y="1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">无感免密进入</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> Shell</tspan></tspan></text></g></g></g></g></g></g><defs><filter id="output2-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><defs><filter id="output2-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs></svg>