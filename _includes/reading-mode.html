<!-- Collapsible Sidebar & Panel (Adaptive Reading Mode) Controller -->
<script>
  (function () {
    function initReadingMode() {
      const body = document.body;
      const isPost = body.classList.contains('layout-post');
      const layoutBtn = document.getElementById('layout-toggle');
      const sidebarTrigger = document.getElementById('sidebar-trigger');
      const panelTrigger = document.getElementById('panel-trigger');
      const mask = document.getElementById('mask');
      const popup = document.getElementById('toc-popup');
      const popupContent = document.getElementById('toc-popup-content');
      const popupClose = document.getElementById('toc-popup-close');
      const tocSource = document.getElementById('toc');

      // 1. Initial State:
      // When entering an article from home, middle column adapts to BOTH left and right sides
      if (isPost) {
        body.setAttribute('data-sidebar', 'closed');
        body.setAttribute('data-panel', 'closed');
      } else {
        body.setAttribute('data-sidebar', 'open');
        body.setAttribute('data-panel', 'open');
      }

      function updateButtons() {
        const sidebarState = body.getAttribute('data-sidebar');
        const panelState = body.getAttribute('data-panel');

        if (sidebarTrigger) {
          sidebarTrigger.title = sidebarState === 'open' ? '收起左侧栏 ([)' : '呼出左侧栏 ([)';
          sidebarTrigger.setAttribute('aria-label', sidebarTrigger.title);
          sidebarTrigger.classList.toggle('active', sidebarState === 'open');
        }

        if (panelTrigger) {
          panelTrigger.title = panelState === 'open' ? '收起右侧栏 (])' : '呼出右侧栏 (])';
          panelTrigger.setAttribute('aria-label', panelTrigger.title);
          panelTrigger.classList.toggle('active', panelState === 'open');
        }

        if (layoutBtn) {
          const bothClosed = sidebarState === 'closed' && panelState === 'closed';
          layoutBtn.title = bothClosed ? '展开两侧栏（三栏全貌）' : '收起两侧栏（专注阅读）';
          layoutBtn.setAttribute('aria-label', layoutBtn.title);
          layoutBtn.innerHTML = bothClosed
            ? '<i class="fa-solid fa-table-columns fa-fw"></i>'
            : '<i class="fa-solid fa-book-open fa-fw"></i>';
        }
      }

      updateButtons();

      // 2. Toggle Left Sidebar ([ key / sidebarTrigger)
      function toggleLeft() {
        const current = body.getAttribute('data-sidebar');
        const next = current === 'open' ? 'closed' : 'open';
        body.setAttribute('data-sidebar', next);

        // On mobile, also sync sidebar-display
        if (window.innerWidth < 992) {
          if (next === 'open') {
            body.setAttribute('sidebar-display', '');
            if (mask) mask.classList.remove('d-none');
          } else {
            body.removeAttribute('sidebar-display');
            if (mask) mask.classList.add('d-none');
          }
        }
        updateButtons();
      }

      // 3. Toggle Right Sidebar (] key / panelTrigger)
      function toggleRight() {
        const current = body.getAttribute('data-panel');
        const next = current === 'open' ? 'closed' : 'open';
        body.setAttribute('data-panel', next);

        // On mobile, also toggle mask
        if (window.innerWidth < 992) {
          if (next === 'open') {
            body.setAttribute('panel-display', '');
            if (mask) mask.classList.remove('d-none');
          } else {
            body.removeAttribute('panel-display');
            if (mask) mask.classList.add('d-none');
          }
        }
        updateButtons();
      }

      // 4. Toggle Article TOC Modal (\ key / topbar-toc-trigger / toc-solo-trigger)
      function toggleTocModal() {
        if (!popup) return;
        if (popup.open) {
          popup.close();
        } else {
          const currentToc = document.getElementById('toc');
          if (currentToc && currentToc.innerHTML.trim()) {
            if (popupContent.innerHTML !== currentToc.innerHTML) {
              popupContent.innerHTML = currentToc.innerHTML;
              popupContent.querySelectorAll('a').forEach(function (a) {
                a.addEventListener('click', function () {
                  popup.close();
                });
              });
            }
            if (typeof popup.showModal === 'function') {
              popup.showModal();
            }
          }
        }
      }

      // 5. Layout Toggle Button (toggles both)
      if (layoutBtn) {
        layoutBtn.addEventListener('click', function (e) {
          e.preventDefault();
          const sidebarState = body.getAttribute('data-sidebar');
          const panelState = body.getAttribute('data-panel');
          if (sidebarState === 'closed' && panelState === 'closed') {
            body.setAttribute('data-sidebar', 'open');
            body.setAttribute('data-panel', 'open');
          } else {
            body.setAttribute('data-sidebar', 'closed');
            body.setAttribute('data-panel', 'closed');
          }
          updateButtons();
        });
      }

      // 6. Click Listeners
      if (sidebarTrigger) {
        sidebarTrigger.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopImmediatePropagation();
          toggleLeft();
        }, true);
      }

      if (panelTrigger) {
        panelTrigger.addEventListener('click', function (e) {
          e.preventDefault();
          toggleRight();
        });
      }

      document.querySelectorAll('.toc-trigger').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          toggleTocModal();
        });
      });

      if (mask) {
        mask.addEventListener('click', function () {
          body.setAttribute('data-sidebar', 'closed');
          body.setAttribute('data-panel', 'closed');
          body.removeAttribute('sidebar-display');
          body.removeAttribute('panel-display');
          mask.classList.add('d-none');
          updateButtons();
        });
      }

      if (popupClose) {
        popupClose.addEventListener('click', function () {
          popup.close();
        });
      }

      if (popup) {
        popup.addEventListener('click', function (e) {
          const rect = popup.getBoundingClientRect();
          const isInDialog = (
            rect.top <= e.clientY &&
            e.clientY <= rect.top + rect.height &&
            rect.left <= e.clientX &&
            e.clientX <= rect.left + rect.width
          );
          if (!isInDialog) {
            popup.close();
          }
        });
      }

      // 7. Keyboard Shortcuts:
      // [ -> 呼出 / 关闭左侧栏抽屉，中间栏向左侧自适应宽度
      // ] -> 呼出 / 关闭右侧栏抽屉，中间栏向右侧自适应宽度
      // \ -> 阅读文章时呼出 / 关闭文章目录
      // Escape -> 关闭目录弹窗或遮罩
      document.addEventListener('keydown', function (e) {
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

        if (e.key === '[' || e.key === '【') {
          e.preventDefault();
          toggleLeft();
        } else if (e.key === ']' || e.key === '】') {
          e.preventDefault();
          toggleRight();
        } else if (e.key === '\\' || e.key === '、') {
          if (isPost && document.getElementById('toc')?.innerHTML.trim()) {
            e.preventDefault();
            toggleTocModal();
          }
        } else if (e.key === 'Escape') {
          if (popup && popup.open) {
            popup.close();
          }
          if (window.innerWidth < 992) {
            body.removeAttribute('sidebar-display');
            body.removeAttribute('panel-display');
            if (mask) mask.classList.add('d-none');
          }
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initReadingMode);
    } else {
      initReadingMode();
    }
  })();
</script>
