<!-- Table of Contents Floating Dialog Modal -->
<dialog id="toc-popup" class="toc-dialog" aria-labelledby="toc-dialog-title">
  <div class="toc-dialog-header">
    <div id="toc-dialog-title" class="toc-dialog-title">
      <i class="fa-solid fa-list-ul me-2"></i>文章目录
      <span class="toc-shortcut-hint ms-2">(\ 或 Esc 关闭)</span>
    </div>
    <button type="button" id="toc-popup-close" class="btn btn-link text-muted p-0" aria-label="关闭目录">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>
  <div id="toc-popup-content" class="toc-dialog-content"></div>
</dialog>

<!-- Reading Mode & Shortcut Controller -->
<script src="{{ '/assets/js/reading-mode.js' | relative_url }}" defer></script>
